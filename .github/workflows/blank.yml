name: Build Snow Rider Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find game page and create desktop app files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE

          # Prefer the original Android WebView game page.
          $indexFile = Get-ChildItem -LiteralPath $repo -Filter 'index.html' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName.Replace('\', '/').EndsWith('/app/src/main/assets/index.html', [System.StringComparison]::OrdinalIgnoreCase) } |
            Select-Object -First 1

          # If the source ZIP is in the repository, extract it and look again.
          if ($null -eq $indexFile) {
            $archive = Get-ChildItem -LiteralPath $repo -Filter '*.zip' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($null -ne $archive) {
              $extractPath = Join-Path $env:RUNNER_TEMP 'snowrider-source'
              New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
              Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extractPath -Force
              $indexFile = Get-ChildItem -LiteralPath $extractPath -Filter 'index.html' -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName.Replace('\', '/').EndsWith('/app/src/main/assets/index.html', [System.StringComparison]::OrdinalIgnoreCase) } |
                Select-Object -First 1
            }
          }

          if ($null -eq $indexFile) {
            throw 'Could not find the game page. Keep app/src/main/assets/index.html in the repository or put the original SnowRider ZIP in the repository.'
          }

          # Create the Electron app automatically. No pre-existing desktop-app folder is required.
          $desktop = Join-Path $repo 'desktop-app'
          New-Item -ItemType Directory -Path $desktop -Force | Out-Null
          Copy-Item -LiteralPath $indexFile.FullName -Destination (Join-Path $desktop 'index.html') -Force

          $package = [ordered]@{
            name = 'snow-rider-3d-desktop'
            version = '1.0.0'
            private = $true
            description = 'Snow Rider 3D Windows desktop wrapper'
            main = 'main.js'
            scripts = @{ build = 'electron-builder --win' }
            devDependencies = @{ electron = 'latest'; 'electron-builder' = 'latest' }
            build = [ordered]@{
              appId = 'com.snowrider.desktop'
              productName = 'Snow Rider 3D'
              directories = @{ output = 'release' }
              files = @('package.json', 'main.js', 'index.html')
              win = @{ target = @(@{ target = 'nsis'; arch = @('x64') }, @{ target = 'portable'; arch = @('x64') }) }
              nsis = @{ artifactName = 'SnowRider-Setup-${version}.${ext}'; oneClick = $false; allowToChangeInstallationDirectory = $true; createDesktopShortcut = $true; createStartMenuShortcut = $true }
              portable = @{ artifactName = 'SnowRider-Portable-${version}.${ext}' }
            }
          }
          $packageJson = $package | ConvertTo-Json -Depth 20
          [IO.File]::WriteAllText((Join-Path $desktop 'package.json'), $packageJson, [Text.UTF8Encoding]::new($false))

          $mainJsBase64 = ''
          [IO.File]::WriteAllBytes((Join-Path $desktop 'main.js'), [Convert]::FromBase64String($mainJsBase64))
          Write-Host "Using game page: $($indexFile.FullName)"
          Write-Host 'Electron app files created successfully.'

      - name: Install Electron dependencies
        working-directory: desktop-app
        run: npm install --no-audit --no-fund

      - name: Build Windows installer and portable EXE
        working-directory: desktop-app
        run: npm run build

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: SnowRider-Windows-EXE
          path: desktop-app/release/*.exe
          if-no-files-found: error
